<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apex | Онлайн Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #ffffff);
    padding-bottom: 100px;
  }
  .container { padding: 12px; }
  h1 { font-size: 22px; margin-bottom: 10px; text-align: center; }
  .status-box { text-align: center; padding: 40px 10px; color: var(--tg-theme-hint-color, #8aa); }
  .error-box { text-align: center; padding: 20px 10px; color: #ff6b6b; font-size: 14px; white-space: pre-wrap; }
  .result-box {
    display: none; margin: 12px 0; padding: 14px; border-radius: 12px;
    background: rgba(77,216,101,0.12); border: 1px solid rgba(77,216,101,0.5);
    font-size: 14px; line-height: 1.45; color: var(--tg-theme-text-color, #fff);
  }
  .result-box.bad { background: rgba(255,107,107,0.12); border-color: rgba(255,107,107,0.5); }

  .cat-row {
    display: flex; overflow-x: auto; gap: 8px; padding: 4px 0 12px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex: 0 0 auto; background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-text-color, #fff); border: none; border-radius: 20px;
    padding: 9px 16px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .cat-chip.active { background: #2f6fed; color: #fff; }

  .back-btn {
    background: transparent; color: var(--tg-theme-hint-color, #8aa);
    border: none; font-size: 15px; padding: 4px 0 10px; cursor: pointer;
  }
  h2.cat-title { font-size: 18px; margin-bottom: 10px; }

  .product-card {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .product-photo {
    width: 74px; height: 74px; border-radius: 10px; object-fit: cover;
    background: #1a2330; flex: 0 0 auto; display: none;
  }
  .product-emoji {
    width: 74px; height: 74px; border-radius: 10px; background: #1a2330;
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .product-info { flex: 1 1 auto; min-width: 0; }
  .product-card h3 { font-size: 16px; margin-bottom: 4px; }
  .product-card .desc { font-size: 13px; color: var(--tg-theme-hint-color, #8aa); margin-bottom: 6px; }
  .price-line { font-size: 15px; margin-bottom: 10px; }
  .price-line .old { text-decoration: line-through; opacity: 0.6; margin-right: 6px; }
  .price-line .new { color: #4dd865; font-weight: bold; }

  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .qty-controls { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: #2f6fed; color: #fff; font-size: 16px; cursor: pointer;
  }

  .checkout-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--tg-theme-bg-color, #17212b);
    padding: 10px 14px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .total-line { text-align: right; font-size: 16px; margin-bottom: 8px; cursor: pointer; }
  .checkout-btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--tg-theme-button-color, #2f9e44);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 17px; cursor: pointer;
  }
  .copy-btn {
    width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 10px;
    background: #2f6fed; color: #fff; font-size: 15px; cursor: pointer;
  }

  details.diag {
    margin-top: 14px; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 10px 12px; font-size: 13px;
    color: var(--tg-theme-hint-color, #8aa);
  }
  details.diag summary { cursor: pointer; outline: none; }
  .diag pre { white-space: pre-wrap; font-family: inherit; margin-top: 8px; }
  .diag button {
    margin-top: 10px; padding: 9px 14px; border: none; border-radius: 8px;
    background: #2f6fed; color: #fff; font-size: 13px; cursor: pointer;
  }
  .ver { text-align: center; font-size: 11px; color: var(--tg-theme-hint-color, #8aa); margin: 16px 0 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>🛍 Apex</h1>
  <div class="result-box" id="result"></div>
  <div id="screen"><div class="status-box">Загрузка товаров...</div></div>
  <div class="error-box" id="error"></div>

  <details class="diag">
    <summary>⚙️ Диагностика</summary>
    <pre id="diaginfo">...</pre>
    <button id="testbtn">🧪 Тест отправки</button>
  </details>
  <div class="ver">версия страницы: v13</div>
</div>

<div class="checkout-bar">
  <div class="total-line" id="total">Итого: 0 ₽</div>
  <button class="checkout-btn" id="checkout">Оформить заказ</button>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.expand(); } catch (e) {}
}

var products = {};
var discounts = { byItem: {}, byCategory: {}, global: 0 };
var cart = {};
var currentCategory = null;
var orderJustSent = false;

var screenEl = document.getElementById('screen');
var errorEl = document.getElementById('error');
var resultEl = document.getElementById('result');
var totalEl = document.getElementById('total');
var checkoutBtn = document.getElementById('checkout');

// ---------- УТИЛИТЫ ----------

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function priceFor(key) {
  var p = products[key];
  if (!p) return { percent: 0, original: 0, final: 0 };
  var percent = discounts.byItem[key] || discounts.byCategory[p.category] || discounts.global || 0;
  var original = p.price || 0;
  var final = Math.round(original * (1 - percent / 100));
  return { percent: percent, original: original, final: final };
}

function cartCount() {
  var n = 0;
  for (var key in cart) n += cart[key];
  return n;
}

function cartTotal() {
  var sum = 0;
  for (var key in cart) sum += priceFor(key).final * cart[key];
  return sum;
}

function updateCartBar() {
  totalEl.textContent = 'Итого: ' + cartTotal() + ' ₽' + (cartCount() ? ' (' + cartCount() + ' шт.)' : '');
}

function addToCart(key) {
  cart[key] = (cart[key] || 0) + 1;
  updateCartBar();
  if (currentCategory) openCategory(currentCategory);
  else renderChips();
}

function changeQty(key, d) {
  cart[key] = (cart[key] || 0) + d;
  if (cart[key] <= 0) delete cart[key];
  updateCartBar();
  if (currentCategory) openCategory(currentCategory);
  else renderChips();
}

// ---------- ЭКРАН: КАТЕГОРИИ ----------

function renderChips() {
  var cats = [];
  var seen = {};
  for (var key in products) {
    var c = products[key].category;
    if (!seen[c]) { seen[c] = true; cats.push(c); }
  }
  cats.sort();
  var html = '<div class="cat-row">';
  html += '<button class="cat-chip ' + (currentCategory ? '' : 'active') +
          '" onclick="openCategory(\'all\')">📦 Все</button>';
  for (var i = 0; i < cats.length; i++) {
    html += '<button class="cat-chip ' + (currentCategory === cats[i] ? 'active' : '') +
            '" onclick="openCategory(this.dataset.c)" data-c="' + esc(cats[i]) + '">' + esc(cats[i]) + '</button>';
  }
  html += '</div>';
  screenEl.innerHTML = html + '<div class="status-box">Выбери категорию выше 👆</div>';
}

function openCategory(cat) {
  currentCategory = cat;
  var cats = [];
  var seen = {};
  for (var key in products) {
    var c = products[key].category;
    if (!seen[c]) { seen[c] = true; cats.push(c); }
  }
  cats.sort();

  var html = '<div class="cat-row">';
  html += '<button class="cat-chip ' + (cat !== 'all' ? '' : 'active') +
          '" onclick="openCategory(\'all\')">📦 Все</button>';
  for (var i = 0; i < cats.length; i++) {
    html += '<button class="cat-chip ' + (cat === cats[i] ? 'active' : '') +
            '" onclick="openCategory(this.dataset.c)" data-c="' + esc(cats[i]) + '">' + esc(cats[i]) + '</button>';
  }
  html += '</div>';
  html += '<h2 class="cat-title">' + (cat === 'all' ? '📦 Все товары' : '📁 ' + esc(cat)) + '</h2>';

  var count = 0;
  for (var key in products) {
    var p = products[key];
    if (cat !== 'all' && p.category !== cat) continue;
    count++;
    var pr = priceFor(key);
    var priceHtml;
    if (pr.percent > 0) {
      priceHtml = '<span class="old">' + pr.original + ' ₽</span>' +
                  '<span class="new">' + pr.final + ' ₽</span> <small>(-' + pr.percent + '%)</small>';
    } else {
      priceHtml = '<span class="new">' + pr.original + ' ₽</span>';
    }
    var photoHtml;
    if (p.photo) {
      photoHtml = '<img class="product-photo" id="ph_' + esc(key) + '" alt="" ' +
                  'onerror="this.style.display=\'none\';document.getElementById(\'pe_' + esc(key) +
                  '\').style.display=\'flex\'">' +
                  '<div class="product-emoji" id="pe_' + esc(key) + '" style="display:none">📦</div>';
    } else {
      photoHtml = '<div class="product-emoji">📦</div>';
    }
    html +=
      '<div class="product-card">' +
        photoHtml +
        '<div class="product-info">' +
          '<h3>' + esc(p.name) + '</h3>' +
          (p.desc ? '<div class="desc">' + esc(p.desc) + '</div>' : '') +
          '<div class="price-line">' + priceHtml + '</div>' +
          '<button class="add-btn" style="width:100%;padding:10px;border:none;border-radius:8px;background:var(--tg-theme-button-color,#2f9e44);color:#fff;font-size:15px;cursor:pointer" onclick="addToCart(this.dataset.k)" data-k="' + esc(key) + '">🛒 В корзину</button>' +
        '</div>' +
      '</div>';
  }

  if (!count) html += '<div class="status-box">Товаров пока нет 🙂</div>';
  screenEl.innerHTML = html;

  // показываем фото, если оно загрузилось
  for (var key in products) {
    var img = document.getElementById('ph_' + cssId(key));
    if (img) {
      img.src = 'photos/' + products[key].photo;
      if (img.complete && img.naturalWidth) img.style.display = 'block';
      else img.onload = function () { this.style.display = 'block'; this.nextSibling && (this.nextSibling.style.display = 'none'); };
    }
  }
}

function cssId(key) {
  return String(key).replace(/[^a-zA-Z0-9_-]/g, '');
}

function showCart() {
  currentCategory = null;
  var html = '<button class="back-btn" onclick="renderChips()">⬅️ К каталогу</button>';
  html += '<h2 class="cat-title">🛒 Корзина</h2>';
  var any = false;
  var sum = 0;
  for (var key in cart) {
    any = true;
    var p = products[key];
    if (!p) continue;
    var pr = priceFor(key);
    sum += pr.final * cart[key];
    html +=
      '<div class="cart-item">' +
        '<div><b>' + esc(p.name) + '</b><br><small>' + pr.final + ' ₽ × ' + cart[key] + '</small></div>' +
        '<div class="qty-controls">' +
          '<button class="qty-btn" onclick="changeQty(this.dataset.k,-1)" data-k="' + esc(key) + '">−</button>' +
          '<span>' + cart[key] + '</span>' +
          '<button class="qty-btn" onclick="changeQty(this.dataset.k,1)" data-k="' + esc(key) + '">+</button>' +
        '</div>' +
      '</div>';
  }
  if (!any) html += '<div class="status-box">Корзина пуста 🙂</div>';
  else html += '<div class="total-line" style="text-align:right;font-size:16px;margin:10px 0;">Итого: ' + sum + ' ₽</div>';
  screenEl.innerHTML = html;
}

// ---------- ОФОРМЛЕНИЕ ЗАКАЗА ----------

checkoutBtn.onclick = function () {
  var n = cartCount();
  if (!n) return;

  var order = [];
  for (var key in cart) order.push({ key: key, qty: cart[key] });
  var payload = JSON.stringify({ order: order });

  var lines = [];
  var sum = 0;
  for (var i = 0; i < order.length; i++) {
    var p = products[order[i].key];
    var pr = priceFor(order[i].key);
    sum += pr.final * order[i].qty;
    lines.push('• ' + (p ? p.name : order[i].key) + ' × ' + order[i].qty + ' — ' + (pr.final * order[i].qty) + ' ₽');
  }
  var orderText = 'Заказ из Apex:\n' + lines.join('\n') + '\nИтого: ' + sum + ' ₽';

  var sent = false;
  try {
    if (tg && typeof tg.sendData === 'function') {
      tg.sendData(payload);
      sent = true;
    }
  } catch (e) {
    sent = false;
  }

  if (sent) {
    // Telegram сам закроет приложение после sendData на телефоне — это его нормальное поведение.
    // Явно окно не закрываем.
    resultEl.className = 'result-box';
    resultEl.innerHTML = '✅ Заказ отправлен в Telegram.<br><br>' +
      'Бот ответит в чате сообщением «Заказ из приложения принят!». ' +
      'Если ответа нет — открой магазин через кнопку «🛍 Открыть магазин» <b>в чате</b> (не через ☰ Меню) и повтори заказ.';
  } else {
    resultEl.className = 'result-box bad';
    resultEl.innerHTML = '⚠️ Не удалось отправить заказ из этого окна.<br><br>' +
      'Скопируй заказ и пришли его боту сообщением:<br><br><b>' + esc(orderText) + '</b>';
    addCopyButton(orderText);
  }
  resultEl.style.display = 'block';
  cart = {};
  updateCartBar();
  window.scrollTo(0, 0);
};

function addCopyButton(text) {
  var btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '📋 Скопировать заказ';
  btn.onclick = function () {
    var done = function () { btn.textContent = '✅ Скопировано'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  };
  resultEl.appendChild(document.createElement('br'));
  resultEl.appendChild(btn);
}

function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

// ---------- ДИАГНОСТИКА ----------

function updateDiag(loaded, extra) {
  var info = 'версия: v13\n' +
    'платформа: ' + (tg && tg.platform ? tg.platform : 'неизвестно') + '\n' +
    'версия WebApp: ' + (tg && tg.version ? tg.version : 'неизвестно') + '\n' +
    'товаров загружено: ' + loaded + '\n' +
    'sendData доступен: ' + (tg && typeof tg.sendData === 'function' ? 'да' : 'нет');
  if (extra) info += '\n' + extra;
  document.getElementById('diaginfo').textContent = info;
}

document.getElementById('testbtn').onclick = function () {
  try {
    if (tg && typeof tg.sendData === 'function') {
      tg.sendData(JSON.stringify({ order: [] }));
      resultEl.className = 'result-box';
      resultEl.innerHTML = '🧪 Тест отправлен. Если бот ответил в чате «Корзина в приложении пуста 🙂» — доставка работает.';
    } else {
      resultEl.className = 'result-box bad';
      resultEl.innerHTML = 'sendData недоступен в этом клиенте.';
    }
  } catch (e) {
    resultEl.className = 'result-box bad';
    resultEl.innerHTML = 'Ошибка отправки: ' + esc(String(e));
  }
  resultEl.style.display = 'block';
  window.scrollTo(0, 0);
};

totalEl.onclick = function () { if (!orderJustSent) showCart(); };

// ---------- ЗАГРУЗКА ДАННЫХ ----------

function load() {
  var t = Date.now();
  fetch('products.json?t=' + t)
    .then(function (r) {
      if (!r.ok) throw new Error('products.json не найден (код ' + r.status + ')');
      return r.json();
    })
    .then(function (data) {
      products = data || {};
      for (var key in products) products[key].key = key;
      return fetch('discounts.json?t=' + t);
    })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) discounts = d; })
    .then(function () {
      var count = 0;
      for (var k in products) count++;
      if (!count) {
        screenEl.innerHTML = '<div class="status-box">Каталог пуст — проверь products.json</div>';
        updateDiag(0, 'products.json загрузился, но пуст');
        return;
      }
      renderChips();
      updateCartBar();
      updateDiag(count);
    })
    .catch(function (e) {
      screenEl.innerHTML = '';
      errorEl.textContent = 'Не удалось загрузить каталог: ' + e.message +
        '\n\nПроверь, что products.json загружен в репозиторий рядом с index.html.';
      updateDiag(0, 'ошибка: ' + e.message);
    });
}

load();
</script>
</body>
</html>
