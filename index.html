<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apex | Онлайн Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0f0f13; color:#eee; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:14px 14px 110px; }
  h1 { text-align:center; font-size:26px; margin:10px 0 16px; }
  .warn { background:#3a2e14; border:1px solid #7a5c1e; color:#ffd97a; font-size:12px; line-height:1.45; padding:10px 12px; border-radius:12px; margin-bottom:14px; }
  #cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { background:#23232b; color:#ddd; border:none; border-radius:20px; padding:8px 16px; font-size:14px; cursor:pointer; }
  .chip.on { background:#4f6ef7; color:#fff; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:#1a1a21; border-radius:14px; overflow:hidden; padding-bottom:10px; }
  .card img, .card .noimg { width:100%; height:110px; object-fit:cover; display:block; background:#23232b; }
  .card .noimg { display:flex; align-items:center; justify-content:center; font-size:34px; }
  .card .nm { font-size:14px; font-weight:600; padding:8px 10px 2px; }
  .card .pr { font-size:14px; padding:0 10px 8px; }
  .card .pr s { color:#888; font-size:12px; margin-left:4px; }
  .card .row { display:flex; align-items:center; gap:8px; padding:0 10px; }
  .card .row button { background:#2f2f3a; color:#fff; border:none; border-radius:8px; width:30px; height:30px; font-size:16px; cursor:pointer; }
  .card .row .q { min-width:18px; text-align:center; }
  .card .add { width:calc(100% - 20px); margin:0 10px; margin-top:8px; background:#4f6ef7; color:#fff; border:none; border-radius:10px; padding:9px 0; font-size:13px; cursor:pointer; }
  .result { background:#16241a; border:1px solid #2e6b45; border-radius:14px; padding:14px; margin-top:14px; font-size:14px; line-height:1.5; }
  .result pre { background:#0c0f0d; border-radius:8px; padding:10px; margin:10px 0; white-space:pre-wrap; font-size:12px; }
  .result button { background:#2b7a4b; color:#fff; border:none; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; margin-top:4px; }
  .result button.alt { background:#3a3a45; }
  .diag { background:#181820; border-radius:14px; padding:12px; margin-top:18px; font-size:13px; color:#9aa; line-height:1.7; }
  .diag summary { color:#ccc; cursor:pointer; }
  .diag button { background:#4f6ef7; color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13px; cursor:pointer; margin-top:8px; }
  .bottom { position:fixed; left:0; right:0; bottom:0; background:#17171d; border-top:1px solid #26262e; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
  .bottom .in { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .bottom .total { font-size:17px; font-weight:700; white-space:nowrap; }
  .bottom button { flex:1; background:#4f6ef7; color:#fff; border:none; border-radius:14px; padding:15px 0; font-size:16px; font-weight:700; cursor:pointer; }
  .empty { text-align:center; color:#777; padding:30px 0; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛍 Apex</h1>
  <div class="warn">⚠️ Заказ доходит, только когда магазин открыт кнопкой «🛍 Открыть магазин» в чате (у поля ввода или в сообщении бота). Через меню ☰ сверху Telegram молча НЕ отправляет заказ — тогда используйте кнопку копирования ниже.</div>
  <div id="cats"></div>
  <div id="grid"><div class="empty">Загружаю товары…</div></div>

  <div id="result" class="result" style="display:none"></div>

  <details class="diag">
    <summary>⚙️ Диагностика</summary>
    <div id="diagInfo">…</div>
    <button id="testBtn">🧪 Тест отправки</button>
  </details>
</div>

<div class="bottom">
  <div class="in">
    <div class="total">Итого: <span id="total">0 ₽</span></div>
    <button id="orderBtn">Оформить заказ</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const VERSION = 'v15';
const BASE = location.href.split('?')[0];

let products = {};
let discounts = { byItem:{}, byCategory:{}, global:0 };
let cart = {};
let activeCat = 'all';

function fmt(n) { return n + ' ₽'; }

function discPercent(p) {
  const byItem = discounts.byItem[p.key] || 0;
  const byCat  = discounts.byCategory[p.category] || 0;
  const glob   = discounts.global || 0;
  return byItem || byCat || glob;
}
function finalPrice(p) {
  const pct = discPercent(p);
  return { pct: pct, price: Math.round(p.price * (1 - pct / 100)) };
}

async function load() {
  const t = Date.now();
  try {
    const r1 = await fetch('products.json?t=' + t);
    products = await r1.json();
  } catch(e) { products = {}; }
  try {
    const r2 = await fetch('discounts.json?t=' + t);
    discounts = await r2.json();
    if (!discounts.byItem) discounts.byItem = {};
    if (!discounts.byCategory) discounts.byCategory = {};
    if (!discounts.global) discounts.global = 0;
  } catch(e) { discounts = { byItem:{}, byCategory:{}, global:0 }; }
  renderCats();
  renderGrid();
  renderDiag();
}

function cats() {
  const s = new Set();
  for (const k in products) s.add(products[k].category);
  return Array.from(s).sort();
}

function renderCats() {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeCat === val ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { activeCat = val; renderCats(); renderGrid(); };
    box.appendChild(b);
  };
  mk('📦 Все', 'all');
  cats().forEach(c => mk(c, c));
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = Object.values(products).filter(p => activeCat === 'all' || p.category === activeCat);
  if (!list.length) {
    grid.innerHTML = '<div class="empty">Товаров пока нет 🤷</div>';
    return;
  }
  list.forEach(p => {
    const fp = finalPrice(p);
    const card = document.createElement('div');
    card.className = 'card';
    let photoHtml;
    if (p.photo) {
      photoHtml = '<img src="' + BASE + 'photos/' + encodeURIComponent(p.photo) + '" alt="" onerror="this.outerHTML=\'<div class=noimg>📦</div>\'">';
    } else {
      photoHtml = '<div class="noimg">📦</div>';
    }
    const qty = cart[p.key] || 0;
    card.innerHTML =
      photoHtml +
      '<div class="nm">' + esc(p.name) + '</div>' +
      '<div class="pr">' + fmt(fp.price) + (fp.pct ? ' <s>' + fmt(p.price) + '</s>' : '') + '</div>' +
      '<div class="row">' +
        '<button data-a="minus">−</button><span class="q">' + qty + '</span><button data-a="plus">+</button>' +
      '</div>' +
      '<button class="add">В корзину</button>';
    const qEl = card.querySelector('.q');
    card.querySelector('[data-a=plus]').onclick = () => { cart[p.key] = (cart[p.key] || 0) + 1; qEl.textContent = cart[p.key]; updateTotal(); };
    card.querySelector('[data-a=minus]').onclick = () => { if (cart[p.key]) { cart[p.key]--; qEl.textContent = cart[p.key]; updateTotal(); } };
    card.querySelector('.add').onclick = () => { cart[p.key] = (cart[p.key] || 0) + 1; qEl.textContent = cart[p.key]; updateTotal(); };
    grid.appendChild(card);
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function itemsList() {
  const out = [];
  for (const k in cart) {
    if (cart[k] > 0 && products[k]) out.push({ key: k, qty: cart[k] });
  }
  return out;
}

function totalSum() {
  let sum = 0;
  itemsList().forEach(it => { sum += finalPrice(products[it.key]).price * it.qty; });
  return sum;
}

function updateTotal() {
  document.getElementById('total').textContent = fmt(totalSum());
}

function orderText(items) {
  let lines = ['🛍 Заказ из Apex:'];
  let total = 0;
  items.forEach(it => {
    const p = products[it.key];
    const fp = finalPrice(p);
    lines.push('• ' + p.name + ' × ' + it.qty + ' — ' + (fp.price * it.qty) + ' ₽');
    total += fp.price * it.qty;
  });
  lines.push('Итого: ' + total + ' ₽');
  return lines.join('\n');
}

function showResult(html) {
  const box = document.getElementById('result');
  box.innerHTML = html;
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert('Заказ скопирован. Вставь его в чат с ботом и отправь.'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('Заказ скопирован. Вставь его в чат с ботом и отправь.'); }
  catch(e) { alert('Не получилось скопировать автоматически. Выдели и скопируй текст заказа вручную:'); showResult('<b>Текст заказа:</b><pre>' + esc(text) + '</pre>'); }
  document.body.removeChild(ta);
}

document.getElementById('orderBtn').onclick = () => {
  const items = itemsList();
  if (!items.length) { showResult('🛒 Корзина пуста — добавь товар.'); return; }
  const text = orderText(items);
  try {
    tg.sendData(JSON.stringify({ order: items }));
    showResult('✅ <b>Заказ отправлен!</b><br>Если бот не ответил в чате в течение 10 секунд — Telegram не доставил сообщение (так бывает при открытии через ☰). Тогда нажми кнопку ниже.<br><pre>' + esc(text) + '</pre><button onclick="copyText(window.__orderText)">📋 Скопировать заказ и вставить в чат</button>');
    window.__orderText = text;
  } catch(e) {
    window.__orderText = text;
    showResult('❌ Отправить не удалось. Скопируй заказ и вставь его в чат с ботом:<pre>' + esc(text) + '</pre><button onclick="copyText(window.__orderText)">📋 Скопировать заказ и вставить в чат</button>');
  }
};

document.getElementById('testBtn').onclick = () => {
  try {
    tg.sendData(JSON.stringify({ order: [] }));
    showResult('🧪 Тест отправлен. Если бот ответил в чате «Корзина в приложении пуста 🙂» — доставка работает.');
  } catch(e) {
    showResult('❌ sendData недоступен: ' + esc(String(e)));
  }
};

function renderDiag() {
  const n = Object.keys(products).length;
  document.getElementById('diagInfo').innerHTML =
    'версия: ' + VERSION + '<br>' +
    'платформа: ' + (tg.platform || '?') + '<br>' +
    'версия WebApp: ' + (tg.version || '?') + '<br>' +
    'товаров загружено: ' + n + '<br>' +
    'sendData доступен: ' + (typeof tg.sendData === 'function' ? 'да' : 'нет');
}

load();
</script>
</body>
</html>
