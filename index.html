<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apex</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#121212; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         padding-bottom:90px; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .logo { text-align:center; font-size:28px; font-weight:800; padding:14px 0 4px; }
  .banner { background:#2a2205; border:1px solid #6b5a10; color:#ffd75e; font-size:13px;
            padding:10px 12px; border-radius:10px; margin:10px 0; line-height:1.4; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px; }
  .chip { background:#222; border:1px solid #333; color:#ddd; padding:8px 14px; border-radius:22px;
          font-size:14px; cursor:pointer; }
  .chip.active { background:#4f7cf7; border-color:#4f7cf7; color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .card { background:#1c1c1e; border-radius:14px; overflow:hidden; }
  .card img { width:100%; height:130px; object-fit:cover; display:block; }
  .ph { width:100%; height:130px; display:flex; align-items:center; justify-content:center; font-size:44px;
        background:#26262a; }
  .card .info { padding:10px; }
  .card .name { font-size:15px; font-weight:600; margin-bottom:4px; }
  .card .price { font-size:15px; font-weight:700; color:#7ee081; }
  .card .old { color:#888; text-decoration:line-through; font-size:12px; font-weight:400; margin-left:6px; }
  .qtyrow { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .qbtn { width:32px; height:32px; border-radius:8px; border:none; background:#2c2c2e; color:#fff;
          font-size:18px; cursor:pointer; }
  .qval { min-width:24px; text-align:center; font-size:16px; font-weight:600; }
  .addbtn { width:100%; padding:9px; border:none; border-radius:10px; background:#4f7cf7; color:#fff;
            font-size:14px; font-weight:600; cursor:pointer; }
  .empty { text-align:center; color:#888; padding:40px 0; }
  .result { display:none; background:#12240f; border:1px solid #2e6b1f; color:#9fe88f; padding:12px;
            border-radius:10px; margin:12px 0; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .copybtn { display:none; width:100%; margin:10px 0; padding:11px; border:none; border-radius:10px;
             background:#2c2c2e; color:#fff; font-size:14px; cursor:pointer; }
  .diag { background:#1a1a1c; border:1px solid #2c2c2e; border-radius:10px; margin:14px 0; }
  .diag summary { padding:10px 12px; color:#aaa; font-size:14px; cursor:pointer; }
  .diagbody { padding:0 12px 12px; font-size:13px; color:#bbb; line-height:1.6; }
  .testbtn { padding:8px 14px; border:none; border-radius:8px; background:#2c2c2e; color:#fff;
             font-size:13px; cursor:pointer; margin-top:8px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#1a1a1c; border-top:1px solid #2c2c2e;
         padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .total { font-size:17px; font-weight:700; white-space:nowrap; }
  .checkout { flex:1; padding:12px; border:none; border-radius:12px; background:#4f7cf7; color:#fff;
              font-size:16px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🛍 Apex</div>
  <div class="banner">⚠️ Заказ доходит только при открытии магазина кнопкой «🛍 Открыть магазин» в чате. Кнопка копирования ниже — запасной путь, он работает всегда.</div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Товаров пока нет 🤷</div>

  <div class="result" id="result"></div>
  <button type="button" class="copybtn" id="copybtn" onclick="copyOrder()">📋 Скопировать заказ и вставить в чат</button>

  <details class="diag">
    <summary>⚙️ Диагностика</summary>
    <div class="diagbody" id="diag"></div>
    <div style="padding:0 12px 12px;"><button type="button" class="testbtn" onclick="testSend()">🧪 Тест отправки</button></div>
  </details>
</div>

<div class="bar">
  <div class="total" id="total">Итого: 0 ₽</div>
  <button type="button" class="checkout" onclick="checkout()">Оформить заказ</button>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var PRODUCTS = [];
var DISC = { byItem:{}, byCategory:{}, global:0 };
var cart = {};
var curCat = "all";
var lastOrderText = "";

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function discFor(p) {
  var it = DISC.byItem[p.key] || 0;
  var cat = DISC.byCategory[p.category] || 0;
  var g = DISC.global || 0;
  return it || cat || g;
}
function priceOf(p) {
  var d = discFor(p);
  return Math.round(p.price * (1 - d/100));
}

function renderChips() {
  var cats = [];
  PRODUCTS.forEach(function(p){ if (cats.indexOf(p.category) === -1) cats.push(p.category); });
  var el = document.getElementById("chips");
  el.innerHTML = "";
  var bAll = document.createElement("button");
  bAll.type = "button"; bAll.className = "chip" + (curCat === "all" ? " active" : "");
  bAll.textContent = "📦 Все";
  bAll.onclick = function(){ setCat("all"); };
  el.appendChild(bAll);
  cats.forEach(function(c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (curCat === c ? " active" : "");
    b.textContent = c;
    b.onclick = function(){ setCat(c); };
    el.appendChild(b);
  });
}

function setCat(c) { curCat = c; renderChips(); renderProducts(); }

function renderProducts() {
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var list = PRODUCTS.filter(function(p){ return curCat === "all" || p.category === curCat; });
  grid.innerHTML = "";
  if (!list.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  list.forEach(function(p) {
    var d = discFor(p);
    var card = document.createElement("div");
    card.className = "card";
    var imgHtml = p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : '<div class="ph">📦</div>';
    var priceHtml = priceOf(p) + ' ₽' + (d ? '<span class="old">' + p.price + ' ₽</span>' : '');
    card.innerHTML = imgHtml +
      '<div class="info"><div class="name">' + esc(p.name) + '</div>' +
      '<div class="price">' + priceHtml + '</div>' +
      '<div class="qtyrow">' +
      '<button type="button" class="qbtn" onclick="changeQty(\'' + esc(p.key) + '\',-1)">−</button>' +
      '<span class="qval" id="q_' + esc(p.key) + '">1</span>' +
      '<button type="button" class="qbtn" onclick="changeQty(\'' + esc(p.key) + '\',1)">+</button>' +
      '</div>' +
      '<button type="button" class="addbtn" onclick="addToCart(\'' + esc(p.key) + '\')">В корзину</button>' +
      '</div>';
    grid.appendChild(card);
  });
}

function changeQty(key, delta) {
  var el = document.getElementById("q_" + key);
  if (!el) return;
  var v = parseInt(el.textContent, 10) || 1;
  v = Math.max(1, Math.min(99, v + delta));
  el.textContent = v;
}

function addToCart(key) {
  var el = document.getElementById("q_" + key);
  var qty = el ? (parseInt(el.textContent, 10) || 1) : 1;
  cart[key] = (cart[key] || 0) + qty;
  renderTotal();
}

function cartItems() {
  return Object.keys(cart).map(function(key) {
    var p = PRODUCTS.filter(function(x){ return x.key === key; })[0];
    return p ? { key:key, qty:cart[key], p:p } : null;
  }).filter(Boolean);
}

function renderTotal() {
  var sum = 0;
  cartItems().forEach(function(it){ sum += priceOf(it.p) * it.qty; });
  document.getElementById("total").textContent = "Итого: " + sum + " ₽";
}

function buildOrderText() {
  var lines = ["🛍 Заказ из Apex:"];
  var total = 0;
  cartItems().forEach(function(it) {
    var price = priceOf(it.p);
    lines.push("• " + it.p.name + " × " + it.qty + " — " + (price * it.qty) + " ₽");
    total += price * it.qty;
  });
  lines.push("Итого: " + total + " ₽");
  return lines.join("\n");
}

function checkout() {
  var items = cartItems().map(function(it){ return { key: it.key, qty: it.qty }; });
  var box = document.getElementById("result");
  var copyBtn = document.getElementById("copybtn");
  if (!items.length) {
    box.style.display = "block";
    box.textContent = "🛒 Корзина пуста — добавь товар кнопкой «В корзину».";
    copyBtn.style.display = "none";
    return;
  }
  lastOrderText = buildOrderText();
  var ok = false;
  try {
    if (tg && typeof tg.sendData === "function") {
      tg.sendData(JSON.stringify({ order: items }));
      ok = true;
    }
  } catch (e) { ok = false; }
  box.style.display = "block";
  if (ok) {
    box.textContent = "✅ Заказ отправлен!\n\nЕсли бот НЕ ответил в чате «Заказ из приложения принята» — Telegram не передал данные (так бывает при открытии не из кнопки чата). Тогда нажми кнопку ниже — заказ дойдёт текстом.";
  } else {
    box.textContent = "⚠️ Отправка недоступна в этом режиме. Нажми кнопку ниже и отправь текст боту — заказ будет оформлен.";
  }
  copyBtn.style.display = "block";
}

function copyOrder() {
  var done = function() {
    var box = document.getElementById("result");
    box.style.display = "block";
    box.textContent = "📋 Заказ скопирован.\nТеперь закрой это окно, вставь текст в чат с ботом (долгое нажатие → Вставить) и отправь. Бот оформит заказ.";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastOrderText).then(done, fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy() {
    var ta = document.createElement("textarea");
    ta.value = lastOrderText;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}

function testSend() {
  if (tg && typeof tg.sendData === "function") {
    tg.sendData(JSON.stringify({ order: [] }));
  }
  var box = document.getElementById("result");
  box.style.display = "block";
  box.textContent = "🧪 Тест отправлен. Если бот ответил в чате «Корзина в приложении пуста 🙂» — доставка работает.";
}

function renderDiag() {
  var info = "версия: v16" +
    "\nплатформа: " + (tg ? (tg.platform || "?") : "нет Telegram") +
    "\nверсия WebApp: " + (tg ? tg.version : "?") +
    "\nтоваров загружено: " + PRODUCTS.length +
    "\nsendData доступен: " + (tg && typeof tg.sendData === "function" ? "да" : "нет");
  document.getElementById("diag").textContent = info;
}

function applyDiscounts(data) {
  if (!data || typeof data !== "object") return;
  DISC.byItem = data.byItem || {};
  DISC.byCategory = data.byCategory || {};
  DISC.global = data.global || 0;
}

function loadAll() {
  var cb = "?cache=" + Date.now();
  var doneP = false, doneD = false;
  var after = function() {
    if (doneP && doneD) { renderChips(); renderProducts(); renderTotal(); renderDiag(); }
  };
  fetch("products.json" + cb)
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var arr = [];
      if (Array.isArray(d)) { arr = d; }
      else if (d && typeof d === "object") {
        Object.keys(d).forEach(function(k){ d[k].key = d[k].key || k; arr.push(d[k]); });
      }
      PRODUCTS = arr.filter(function(p){ return p && p.key && p.name; });
      doneP = true; after();
    })
    .catch(function(){ doneP = true; after(); });
  fetch("discounts.json" + cb)
    .then(function(r){ return r.json(); })
    .then(function(d){ applyDiscounts(d); doneD = true; after(); })
    .catch(function(){ doneD = true; after(); });
}

loadAll();
</script>
</body>
</html>
