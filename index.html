<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        h1 { margin-top: 0; color: #fff; }
        .product-card {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #3a3a3c;
        }
        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        .product-price {
            font-size: 18px;
            color: #007aff;
            font-weight: 600;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .cart-summary {
            background: #2c2c2e;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #3a3a3c;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #3a3a3c;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-total {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-top: 12px;
            text-align: right;
        }
        .checkout-btn {
            background-color: #ff3b30;
            margin-top: 16px;
        }
        .success-msg {
            display: none;
            background: #34c759;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
        }
        .error-msg {
            display: none;
            background: #ff9500;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
        }
        .version {
            text-align: center;
            color: #8e8e93;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Магазин</h1>
        <div id="products-list"></div>
        
        <div class="cart-summary" id="cart-view" style="display: none;">
            <h3>Корзина</h3>
            <div id="cart-items"></div>
            <div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div>
            <button id="checkout-btn" class="checkout-btn">Оформить заказ</button>
        </div>

        <div id="ok" class="success-msg">Заказ отправлен! Окно закроется через 2 секунды.</div>
        <div id="err" class="error-msg"></div>
    </div>
    <div class="version">версия страницы: v7</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // --- ВСТАВЛЕННЫЕ ДАННЫЕ ---
        var BOT_TOKEN = '9027935818:AAGcmdwXnTPyQdxW7eTSu6w0g47yWrJG0bk';
        var ADMIN_ID = 1641560713;
        // --------------------------

        var products = [
            {
                id: 'airpods_pro_3',
                name: 'Airpods pro 3',
                price: 2700,
                currency: 'RUB'
            }
        ];

        var cart = {};

        function renderProducts() {
            var list = document.getElementById('products-list');
            list.innerHTML = '';
            products.forEach(function(p) {
                var card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-name">\${p.name}</div>
                    <div class="product-price">\${p.price} ₽</div>
                    <button onclick="addToCart('\${p.id}')">В корзину</button>
                `;
                list.appendChild(card);
            });
        }

        function addToCart(id) {
            if (!cart[id]) cart[id] = 0;
            cart[id]++;
            renderCart();
        }

        function removeFromCart(id) {
            if (cart[id]) {
                cart[id]--;
                if (cart[id] <= 0) delete cart[id];
                renderCart();
            }
        }

        function renderCart() {
            var view = document.getElementById('cart-view');
            var itemsContainer = document.getElementById('cart-items');
            var totalEl = document.getElementById('cart-total');
            
            var keys = Object.keys(cart);
            if (keys.length === 0) {
                view.style.display = 'none';
                return;
            }
            view.style.display = 'block';
            itemsContainer.innerHTML = '';
            var total = 0;

            keys.forEach(function(id) {
                var p = products.find(prod => prod.id === id);
                if (!p) return;
                var itemTotal = p.price * cart[id];
                total += itemTotal;

                var itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <span>${p.name} × ${cart[id]}</span>
                    <span>\${itemTotal} ₽</span>
                `;
                itemsContainer.appendChild(itemRow);
            });

            totalEl.innerText = total;
        }

        function showErr(msg) {
            document.getElementById('err').innerText = msg;
            document.getElementById('err').style.display = 'block';
        }

        document.getElementById('checkout-btn').addEventListener('click', function () {
            try {
                var keys = Object.keys(cart);
                if (!keys.length) {
                    tg.showAlert('Корзина пуста! Сначала добавьте товар кнопкой "В корзину"');
                    return;
                }
                var order = ;
                var total = 0;
                for (var i = 0; i < keys.length; i++) {
                    var p = products.find(prod => prod.id === keys[i]);
                    if (!p) continue;
                    var c = p.price;
                    order.push({ key: keys[i], name: p.name, qty: cart[keys[i]], price: c });
                    total += c * cart[keys[i]];
                }
                var u = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
                var who = u ? ((u.username ? '@' + u.username : '') + ' (id ' + u.id + ')') : 'нет данных о пользователе';
                var lines = order.map(function (o) {
                    return '• ' + o.name + ' × ' + o.qty + ' — ' + (o.price * o.qty) + ' ₽';
                }).join('\n');
                var text = '🛍 НОВЫЙ ЗАКАЗ из Mini App\n\n' + lines + '\n\nИтого: ' + total + ' ₽\nКлиент: ' + who;

                fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + ADMIN_ID + '&text=' + encodeURIComponent(text))
                    .then(function (r) { return r.json(); })
                    .then(function (res) {
                        if (res.ok) {
                            document.getElementById('ok').style.display = 'block';
                            setTimeout(function () { tg.close(); }, 2000);
                        } else {
                            showErr('Telegram ответил ошибкой: ' + (res.description || 'неизвестно'));
                        }
                    })
                    .catch(function (e) {
                        showErr('Ошибка сети: ' + e.message);
                    });
            } catch (e) {
                showErr('Ошибка оформления: ' + e.message);
            }
        });

        renderProducts();
    </script>
</body>
</html>
