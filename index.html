<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apex | Онлайн Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #ffffff);
    padding-bottom: 90px;
  }
  .container { padding: 12px; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  .status-box { text-align: center; padding: 40px 10px; color: var(--tg-theme-hint-color, #8aa); }
  .error-box { text-align: center; padding: 30px 10px; color: #ff6b6b; }

  .cat-btn {
    display: block; width: 100%; text-align: left;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-text-color, #fff);
    border: none; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px;
    font-size: 16px; cursor: pointer;
  }
  .product-card {
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
  }
  .product-card h3 { font-size: 16px; margin-bottom: 4px; }
  .product-card .desc { font-size: 13px; color: var(--tg-theme-hint-color, #8aa); margin-bottom: 6px; }
  .price-line { font-size: 15px; margin-bottom: 10px; }
  .price-line .old { text-decoration: line-through; opacity: 0.6; margin-right: 6px; }
  .price-line .new { color: #4dd865; font-weight: bold; }
  .add-btn {
    background: var(--tg-theme-button-color, #2f9e44);
    color: var(--tg-theme-button-text-color, #fff);
    border: none; border-radius: 8px;
    padding: 10px 14px; font-size: 15px; width: 100%; cursor: pointer;
  }
  .back-btn {
    background: transparent; color: var(--tg-theme-hint-color, #8aa);
    border: none; font-size: 15px; padding: 10px; margin-bottom: 8px; cursor: pointer;
  }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .qty-controls { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: #2f6fed; color: #fff; font-size: 16px; cursor: pointer;
  }
  .checkout-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--tg-theme-bg-color, #17212b);
    padding: 10px 14px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .total-line { text-align: right; font-size: 16px; margin-bottom: 8px; }
  .checkout-btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--tg-theme-button-color, #2f9e44);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 17px; cursor: pointer;
  }
  .ver { text-align: center; color: var(--tg-theme-hint-color, #8aa); font-size: 11px; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>🛍 Apex</h1>

  <div id="loading" class="status-box">Загрузка товаров...</div>
  <div id="error" class="error-box" style="display:none;"></div>

  <div id="screen"></div>
</div>

<div class="checkout-bar" id="checkout-bar" style="display:none;">
  <div class="total-line">Итого: <span id="total">0</span> ₽</div>
  <button class="checkout-btn" id="checkout-btn">Оформить заказ</button>
</div>

<div class="ver">версия страницы: v10</div>

<script>
var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

var products = {};      // { key: {name, price, category, desc, photo} }
var discounts = {};     // { byItem: {}, byCategory: {}, global: 0 }
var cart = {};          // { key: qty }
var currentCategory = null;

var loadingEl = document.getElementById('loading');
var errorEl = document.getElementById('error');
var screenEl = document.getElementById('screen');
var barEl = document.getElementById('checkout-bar');
var totalEl = document.getElementById('total');
var checkoutBtn = document.getElementById('checkout-btn');

// ---------- СКИДКИ ----------

function discountPercentFor(key) {
  var p = products[key];
  if (!p) return 0;
  var byItem = (discounts.byItem || {})[key] || 0;
  var byCat = (discounts.byCategory || {})[p.category] || 0;
  var g = discounts.global || 0;
  return byItem || byCat || g || 0;
}

function priceFor(key) {
  var p = products[key];
  var percent = discountPercentFor(key);
  return {
    percent: percent,
    final: Math.round(p.price * (1 - percent / 100)),
    original: p.price
  };
}

// ---------- ЗАГРУЗКА ДАННЫХ (кэш отключён меткой времени) ----------

function load() {
  fetch('products.json?t=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('products.json не найден (код ' + r.status + ')');
      return r.json();
    })
    .then(function (data) {
      products = data;
      return fetch('discounts.json?t=' + Date.now());
    })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d) discounts = d; })
    .then(function () {
      loadingEl.style.display = 'none';
      showCategories();
      updateCartBar();
    })
    .catch(function (e) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = 'Не удалось загрузить каталог: ' + e.message;
    });
}

// ---------- ЭКРАН: КАТЕГОРИИ ----------

function showCategories() {
  currentCategory = null;
  screenEl.innerHTML = '';
  var cats = {};
  for (var key in products) cats[products[key].category] = true;

  var html = '';
  for (var c in cats) {
    html += '<button class="cat-btn" onclick="openCategory(this.dataset.c)" data-c="' + esc(c) + '">' + esc(c) + '</button>';
  }
  html += '<button class="cat-btn" onclick="openCategory(\'all\')">📦 Все товары</button>';
  screenEl.innerHTML = html;
}

// ---------- ЭКРАН: СПИСОК ТОВАРОВ КАТЕГОРИИ ----------

function openCategory(cat) {
  currentCategory = cat;
  screenEl.innerHTML = '';
  var title = cat === 'all' ? '📦 Все товары' : '📁 ' + cat;

  var html = '<button class="back-btn" onclick="showCategories()">⬅️ Категории</button>';
  html += '<h2 style="font-size:18px;margin-bottom:10px;">' + esc(title) + '</h2>';

  var count = 0;
  for (var key in products) {
    var p = products[key];
    if (cat !== 'all' && p.category !== cat) continue;
    count++;
    var pr = priceFor(key);
    var priceHtml;
    if (pr.percent > 0) {
      priceHtml = '<span class="old">' + pr.original + ' ₽</span>' +
                  '<span class="new">' + pr.final + ' ₽</span>' +
                  ' <small>(-' + pr.percent + '%)</small>';
    } else {
      priceHtml = '<span class="new">' + pr.original + ' ₽</span>';
    }
    html +=
      '<div class="product-card">' +
        '<h3>' + esc(p.name) + '</h3>' +
        (p.desc ? '<div class="desc">' + esc(p.desc) + '</div>' : '') +
        '<div class="price-line">' + priceHtml + '</div>' +
        '<button class="add-btn" onclick="addToCart(this.dataset.k)" data-k="' + esc(key) + '">🛒 В корзину</button>' +
      '</div>';
  }

  if (!count) html += '<div class="status-box">Товаров пока нет</div>';
  screenEl.innerHTML = html;
  window.scrollTo(0, 0);
}

// ---------- КОРЗИНА ----------

function addToCart(key) {
  cart[key] = (cart[key] || 0) + 1;
  updateCartBar();
}

function changeQty(key, delta) {
  if (!cart[key]) return;
  cart[key] += delta;
  if (cart[key] <= 0) delete cart[key];
  showCart();
  updateCartBar();
}

function cartCount() {
  var n = 0;
  for (var k in cart) n += cart[k];
  return n;
}

function cartTotal() {
  var t = 0;
  for (var k in cart) t += priceFor(k).final * cart[k];
  return t;
}

function updateCartBar() {
  var n = cartCount();
  if (n > 0) {
    barEl.style.display = 'block';
    totalEl.textContent = cartTotal();
    checkoutBtn.textContent = 'Оформить заказ (' + n + ')';
  } else {
    barEl.style.display = 'none';
  }
}

function showCart() {
  screenEl.innerHTML = '';
  var html = '<button class="back-btn" onclick="goBack()">⬅️ Назад</button>';
  html += '<h2 style="font-size:18px;margin-bottom:10px;">🛒 Корзина</h2>';

  var any = false;
  for (var key in cart) {
    any = true;
    var p = products[key];
    if (!p) continue;
    var pr = priceFor(key);
    html +=
      '<div class="cart-item">' +
        '<div>' + esc(p.name) + '<br><small>' + pr.final + ' ₽ × ' + cart[key] + ' = ' + (pr.final * cart[key]) + ' ₽</small></div>' +
        '<div class="qty-controls">' +
          '<button class="qty-btn" onclick="changeQty(this.dataset.k,-1)" data-k="' + esc(key) + '">−</button>' +
          '<span>' + cart[key] + '</span>' +
          '<button class="qty-btn" onclick="changeQty(this.dataset.k,1)" data-k="' + esc(key) + '">+</button>' +
        '</div>' +
      '</div>';
  }

  if (!any) html += '<div class="status-box">Корзина пуста 🙂</div>';
  screenEl.innerHTML = html;
}

function goBack() {
  if (currentCategory) openCategory(currentCategory);
  else showCategories();
}

// ---------- ОФОРМЛЕНИЕ ЗАКАЗА ----------

checkoutBtn.onclick = function () {
  var n = cartCount();
  if (!n) return;

  var order = [];
  for (var key in cart) {
    order.push({ key: key, qty: cart[key] });
  }

  // Отправляем заказ боту через web_app_data.
  // shop.py сам пересчитает цены по скидкам и сохранит заказ.
  tg.sendData(JSON.stringify({ order: order }));

  checkoutBtn.textContent = '✅ Заказ отправлен!';
  cart = {};
  updateCartBar();
  setTimeout(function () { tg.close(); }, 2000);
};

// ---------- ЭКРАН: КОРЗИНА ПО КНОПКЕ БЕЗ ПОТЕРИ КАТЕГОРИИ ----------

// Перехватываем стандартное поведение: если пользователь открыл корзину,
// кнопка "назад" вернёт его в категорию, где он был.

// ---------- УТИЛИТЫ ----------

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// перехват кликов по кнопке корзины в нижней панели — если пользователь
// кликнул по ней, но корзина пуста, ничего не делаем
barEl.addEventListener('click', function (e) {
  if (e.target === checkoutBtn) return;
});

// При переходе на экран корзины по клику на нижнюю панель
totalEl.onclick = showCart;

load();
</script>
</body>
</html>
