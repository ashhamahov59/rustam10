<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{font-family:-apple-system,Arial,sans-serif;background:#17212b;color:#fff;margin:0;padding-bottom:130px;}
  h1{text-align:center;color:#7c8fff;}
  #warn{background:#3a2f10;color:#ffd66b;padding:10px;border-radius:10px;margin:10px;font-size:13px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;}
  .chip{padding:8px 14px;border-radius:20px;background:#232e3c;white-space:nowrap;cursor:pointer;}
  .chip.on{background:#5288ff;}
  .card{background:#1f2a37;border-radius:12px;margin:8px 10px;padding:10px;}
  .card img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;}
  .pname{font-weight:bold;margin:6px 0;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .cnt button{width:30px;height:30px;border-radius:8px;border:none;background:#5288ff;color:#fff;font-size:16px;margin:0 4px;}
  #bottom{position:fixed;bottom:0;left:0;right:0;background:#1f2a37;padding:10px;display:flex;justify-content:space-between;align-items:center;}
  #checkout{background:#5288ff;color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;}
  #status{margin:10px;padding:10px;border-radius:10px;display:none;font-size:14px;}
  details{margin:10px;background:#1f2a37;border-radius:10px;padding:8px 10px;font-size:13px;}
  .copy{margin:0 10px 10px;}
  .copy button{width:100%;padding:10px;border-radius:10px;border:none;background:#2b5278;color:#fff;cursor:pointer;}
  #testbtn{margin-top:8px;padding:8px 12px;border-radius:8px;border:none;background:#2b5278;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="warn">⚠️ Заказ доставляется ТОЛЬКО когда магазин открыт кнопкой «🛍 Открыть магазин» в сообщении бота (кнопка у поля ввода или в /start). Через меню ☰ сверху Telegram молча НЕ отправляет заказ — так устроен Telegram.</div>
<h1>🛍 Apex</h1>
<div class="chips" id="cats"></div>
<div id="list"></div>
<div id="status"></div>
<div class="copy" id="copybox" style="display:none"><button onclick="copyOrder()">📋 Скопировать заказ и вставить в чат</button></div>
<details><summary>⚙️ Диагностика</summary><div id="diag">…</div><button id="testbtn">🧪 Тест отправки</button></details>
<div id="bottom"><div>Итого: <span id="total">0</span> ₽</div><button id="checkout">Оформить заказ</button></div>
<script>
const APP_VER = 'v14';
let tg = null;
try { tg = window.Telegram.WebApp; } catch(e) {}
if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

let PRODUCTS = {};
let DISC = { byItem:{}, byCategory:{}, global:0 };
let cart = {};
let curCat = 'all';

function discPct(p){
  const a = DISC.byItem[p.key] || 0;
  const b = DISC.byCategory[p.category] || 0;
  const g = DISC.global || 0;
  return a || b || g;
}
function priceOf(p){
  const pc = discPct(p);
  return pc ? Math.round(p.price * (1 - pc/100)) : p.price;
}
function fmt(n){ return (n||0).toLocaleString('ru-RU'); }

function renderCats(){
  const el = document.getElementById('cats');
  const cats = [];
  for (const k in PRODUCTS){
    const c = PRODUCTS[k].category || 'Прочее';
    if (cats.indexOf(c) === -1) cats.push(c);
  }
  let html = '<div class="chip' + (curCat==='all'?' on':'') + '" data-cat="all">📦 Все</div>';
  for (const c of cats){
    html += '<div class="chip' + (curCat===c?' on':'') + '" data-cat="' + c + '">' + c + '</div>';
  }
  el.innerHTML = html;
  const chips = el.querySelectorAll('.chip');
  for (const ch of chips){
    ch.onclick = function(){ curCat = ch.getAttribute('data-cat'); renderCats(); renderList(); };
  }
}

function renderList(){
  const el = document.getElementById('list');
  const keys = [];
  for (const k in PRODUCTS){
    if (curCat === 'all' || (PRODUCTS[k].category || 'Прочее') === curCat) keys.push(k);
  }
  if (!keys.length){
    el.innerHTML = '<p style="text-align:center;color:#8a99a8">Товаров пока нет 🤷</p>';
    updateTotal();
    return;
  }
  let html = '';
  for (const k of keys){
    const p = PRODUCTS[k];
    const pr = priceOf(p);
    const pc = discPct(p);
    const q = cart[k] || 0;
    let priceHtml;
    if (pc) priceHtml = '<s>' + fmt(p.price) + ' ₽</s> ' + fmt(pr) + ' ₽ (−' + pc + '%)';
    else priceHtml = fmt(pr) + ' ₽';
    html += '<div class="card">'
      + (p.photo ? '<img src="photos/' + p.photo + '" onerror="this.style.display=\'none\'">' : '')
      + '<div class="pname">' + p.name + '</div>'
      + '<div class="row"><span>' + priceHtml + '</span>'
      + '<span class="cnt"><button onclick="chQty(\'' + k + '\',-1)">−</button> ' + q
      + ' <button onclick="chQty(\'' + k + '\',1)">+</button></span></div>'
      + '</div>';
  }
  el.innerHTML = html;
  updateTotal();
}

function chQty(k, d){
  cart[k] = (cart[k] || 0) + d;
  if (cart[k] < 0) cart[k] = 0;
  renderList();
}
function updateTotal(){
  let t = 0;
  for (const k in cart){
    if (cart[k] > 0 && PRODUCTS[k]) t += priceOf(PRODUCTS[k]) * cart[k];
  }
  document.getElementById('total').textContent = fmt(t);
}

function buildItems(){
  const items = [];
  for (const k in cart){
    if (cart[k] > 0 && PRODUCTS[k]) items.push({ key: k, qty: cart[k] });
  }
  return items;
}
function orderText(){
  const items = buildItems();
  let t = '🛍 Заказ из Apex:\n';
  let total = 0;
  for (const it of items){
    const p = PRODUCTS[it.key];
    const pr = priceOf(p);
    t += '• ' + p.name + ' × ' + it.qty + ' — ' + fmt(pr * it.qty) + ' ₽\n';
    total += pr * it.qty;
  }
  t += 'Итого: ' + fmt(total) + ' ₽';
  return t;
}

function showStatus(html, ok){
  const s = document.getElementById('status');
  s.innerHTML = html;
  s.style.display = 'block';
  s.style.background = ok ? '#1c3324' : '#3a1f1f';
  s.style.color = ok ? '#7ee2a8' : '#ff8a8a';
}

function checkout(){
  const items = buildItems();
  if (!items.length){ showStatus('Корзина пуста — добавь товар кнопкой ➕', false); return; }
  const payload = JSON.stringify({ order: items });
  let sent = false, err = '';
  try {
    if (tg && typeof tg.sendData === 'function'){ tg.sendData(payload); sent = true; }
    else err = 'sendData недоступен';
  } catch(e){ err = e.message; }
  if (sent){
    showStatus('✅ Заказ отправлен в чат. Бот ответит подтверждением.<br><br>'
      + 'Если бот МОЛЧИТ — значит магазин открыт не из кнопки чата: закрой это окно и открой магазин через кнопку «🛍 Открыть магазин» в сообщении бота.', true);
    cart = {}; renderList();
  } else {
    showStatus('❌ Не смог отправить: ' + err, false);
    document.getElementById('copybox').style.display = 'block';
  }
}

function copyOrder(){
  const t = orderText();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){
      showStatus('📋 Заказ скопирован — закрой окно, вставь его сообщением в чат с ботом', true);
    });
  } else {
    showStatus('<pre style="white-space:pre-wrap">' + t + '</pre>', true);
  }
}

function testSend(){
  try {
    tg.sendData(JSON.stringify({ order: [], test: true }));
    showStatus('🧪 Тест отправлен. Если бот ответил в чате «Корзина в приложении пуста 🙂» — доставка работает. Если тишина — окно открыто не из кнопки чата.', true);
  } catch(e){
    showStatus('🧪 Ошибка отправки: ' + e.message, false);
  }
}

function diag(){
  const hasTg = !!tg;
  let d = 'версия: ' + APP_VER
    + '<br>платформа: ' + (hasTg ? tg.platform : '—')
    + '<br>версия WebApp: ' + (hasTg ? tg.version : '—')
    + '<br>товаров загружено: ' + Object.keys(PRODUCTS).length
    + '<br>initData: ' + (hasTg && tg.initData ? ('есть, ' + tg.initData.length + ' симв.') : 'НЕТ')
    + '<br>sendData: ' + (hasTg && typeof tg.sendData === 'function' ? 'есть' : 'нет');
  document.getElementById('diag').innerHTML = d;
}

async function load(){
  try {
    const r = await fetch('products.json?t=' + Date.now());
    PRODUCTS = await r.json();
    for (const k in PRODUCTS){ PRODUCTS[k].key = k; }
  } catch(e){
    document.getElementById('list').innerHTML =
      '<p style="color:#ff8a8a;padding:0 14px">Не смог загрузить products.json: ' + e.message + '</p>';
  }
  try {
    const r2 = await fetch('discounts.json?t=' + Date.now());
    const d = await r2.json();
    if (d && d.byItem) DISC = d;
  } catch(e){}
  renderCats();
  renderList();
  diag();
}

document.getElementById('checkout').onclick = checkout;
document.getElementById('testbtn').onclick = testSend;
window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
