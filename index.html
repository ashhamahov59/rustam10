<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-sec: #aaaaaa;
            --accent: #3390ec;
            --accent-hover: #2a78c2;
            --danger: #ff5252;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1 { margin-top: 6px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            flex-grow: 1;
        }
        .product-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .product-name { font-size: 14px; color: var(--text-main); }
        .product-price { font-size: 16px; font-weight: bold; color: var(--accent); }
        .old-price { text-decoration: line-through; color: var(--text-sec); font-size: 12px; }
        .badge-sale {
            background: var(--danger);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            width: fit-content;
            margin: 0 auto;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        button:active { background: var(--accent-hover); }
        .cart-summary {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .cart-items { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; gap: 8px; }
        .cart-total { font-size: 18px; font-weight: bold; color: var(--accent); text-align: right; margin-bottom: 10px; }
        .remove-btn {
            width: auto;
            padding: 2px 8px;
            background: none;
            color: var(--danger);
            font-size: 12px;
            font-weight: normal;
        }
        .empty-state { text-align: center; color: var(--text-sec); margin-top: 50px; }
        .spinner { text-align: center; color: var(--text-sec); margin-top: 20px; }
        .error-box {
            background: #3a1a1a;
            border: 1px solid var(--danger);
            border-radius: 10px;
            padding: 12px;
            margin-top: 20px;
            color: #ffb0b0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🛍 Мой магазин</h1>
    <div id="loading" class="spinner">Загрузка товаров...</div>
    <div id="products-container" class="shop-grid"></div>
    <div class="cart-summary">
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div>
        <button id="checkout-btn" disabled>Оформить заказ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let products = {};
        let discounts = { global: 0, byCategory: {}, byItem: {} };
        let cart = {}; // ключ товара -> количество

        function calculatePrice(p) {
            let percent = 0;
            if (discounts.byItem && discounts.byItem[p.key] !== undefined) {
                percent = discounts.byItem[p.key];
            } else if (discounts.byCategory && discounts.byCategory[p.category] !== undefined) {
                percent = discounts.byCategory[p.category];
            } else if (discounts.global) {
                percent = discounts.global;
            }
            const final = Math.round(p.price * (1 - percent / 100));
            return { final: final, percent: percent, original: p.price };
        }

        async function loadData() {
            try {
                const res = await fetch('./products.json');
                if (!res.ok) throw new Error('products.json не найден на GitHub (код ' + res.status + ')');
                products = await res.json();

                // Скидки: если файла нет — считаем, что скидок нет, это не ошибка
                try {
                    const dRes = await fetch('./discounts.json');
                    if (dRes.ok) discounts = await dRes.json();
                } catch (e) { /* файла скидок нет — работаем без скидок */ }

                document.getElementById('loading').style.display = 'none';
                renderProducts();
            } catch (e) {
                const box = document.createElement('div');
                box.className = 'error-box';
                box.innerText = 'Ошибка: ' + e.message + '. Загрузи products.json в репозиторий (рядом с index.html).';
                document.body.insertBefore(box, document.getElementById('products-container'));
                document.getElementById('loading').innerText = 'Товары не загрузились';
            }
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            const keys = Object.keys(products);
            if (keys.length === 0) {
                container.innerHTML = '<div class="empty-state">Товаров пока нет — добавь их через админку бота</div>';
                return;
            }
            for (const key of keys) {
                const p = products[key];
                p.key = key;
                const calc = calculatePrice(p);
                const card = document.createElement('div');
                card.className = 'product-card';
                let badge = '';
                if (calc.percent > 0) badge = '<div class="badge-sale">-' + calc.percent + '%</div>';
                let oldPrice = '';
                if (calc.percent > 0) oldPrice = '<span class="old-price">' + calc.original + ' ₽</span> ';
                card.innerHTML =
                    badge +
                    '<div class="product-name">' + p.name + '</div>' +
                    '<div class="product-price">' + oldPrice + calc.final + ' ₽</div>';
                const btn = document.createElement('button');
                btn.innerText = 'В корзину';
                btn.onclick = function () { addToCart(key); };
                card.appendChild(btn);
                container.appendChild(card);
            }
        }

        function addToCart(key) {
            cart[key] = (cart[key] || 0) + 1;
            updateCartUI();
        }

        function removeFromCart(key) {
            delete cart[key];
            updateCartUI();
        }

        function updateCartUI() {
            const itemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const btn = document.getElementById('checkout-btn');
            itemsEl.innerHTML = '';
            let total = 0;
            let count = 0;
            for (const key in cart) {
                const p = products[key];
                if (!p) continue;
                const calc = calculatePrice(p);
                const itemTotal = calc.final * cart[key];
                total += itemTotal;
                count += cart[key];
                const row = document.createElement('div');
                row.className = 'cart-item';
                const nameSpan = document.createElement('span');
                nameSpan.innerText = p.name + ' × ' + cart[key];
                const priceSpan = document.createElement('span');
                priceSpan.style.color = 'var(--accent)';
                priceSpan.innerText = itemTotal + ' ₽';
                const delBtn = document.createElement('button');
                delBtn.className = 'remove-btn';
                delBtn.innerText = '✕';
                delBtn.onclick = function () { removeFromCart(key); };
                row.appendChild(nameSpan);
                row.appendChild(priceSpan);
                row.appendChild(delBtn);
                itemsEl.appendChild(row);
            }
            totalEl.innerText = total;
            btn.disabled = count === 0;
        }

        document.getElementById('checkout-btn').addEventListener('click', function () {
            if (Object.keys(cart).length === 0) return;
            const order = [];
            for (const key in cart) {
                const p = products[key];
                if (!p) continue;
                const calc = calculatePrice(p);
                order.push({ key: key, name: p.name, qty: cart[key], price: calc.final });
            }
            tg.sendData(JSON.stringify({ order: order }));
        });

        loadData();
    </script>
</body>
</html>
